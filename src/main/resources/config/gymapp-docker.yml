spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/gymapp_local_dev
    username: ${LOCAL_AND_DEV_USER:costigan}
    password: ${LOCAL_AND_DEV_USER_PASSWORD:BillyCostigan}
  activemq:
    broker-url: tcp://activemq:61616
    user: admin
    password: admin
    in-memory: false
    pool.enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://gymapp-eureka:8761/eureka
    register-with-eureka: true
    fetch-registry: true

management.endpoints.web.exposure.include: "*"